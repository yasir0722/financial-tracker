version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-tracker
    container_name: financial-tracker-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - financial-tracker
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: financial-tracker-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - financial-tracker
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: financial-tracker-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: financial_tracker
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: financial_user
      MYSQL_PASSWORD: financial_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - financial-tracker

  redis:
    image: redis:alpine
    container_name: financial-tracker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - financial-tracker

networks:
  financial-tracker:
    driver: bridge

volumes:
  db_data:
